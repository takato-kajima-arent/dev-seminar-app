<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メール</title>
  <link rel="stylesheet" href="/mail/mail.css" />
</head>
<body>
  <script src="/shared/nav.js"></script>
  <div id="app">
    <header class="topbar">
      <div class="tb-left">
        <button class="icon-btn" title="メインメニュー" aria-label="メインメニュー" data-act="toggle-nav"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
        <a class="brand" href="/mail" title="メール">
          <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg></span>
          <span class="brand-name">メール</span>
        </a>
      </div>
      <form class="search" id="search-form" autocomplete="off">
        <button type="submit" class="icon-btn" title="検索" aria-label="検索"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
        <input id="search" type="search" placeholder="メールを検索" aria-label="メールを検索" />
        <button type="button" class="icon-btn" id="search-clear" title="検索をクリア" aria-label="検索をクリア" hidden><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </form>
      <div class="tb-right">
        <span class="owner" id="owner"></span>
      </div>
    </header>

    <aside class="sidenav" id="sidenav">
      <button class="compose" type="button" data-act="compose">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        <span>作成</span>
      </button>
      <nav id="nav"></nav>
    </aside>

    <main class="content">
      <section class="panel" id="panel"></section>
    </main>
  </div>

  <div class="overlay" id="preview" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="/mail/mail.js"></script>
</body>
</html>
