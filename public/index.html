<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI秘書デモ環境</title>
<style>
  body { margin: 0; font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif; background: #f6f7f9; color: #1f2328; }
  main { max-width: 1080px; margin: 44px auto; padding: 0 24px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .lead { color: #57606a; margin: 0 0 30px; font-size: 15px; }
  h2 { font-size: 15px; color: #57606a; margin: 0 0 12px; letter-spacing: .05em; }
  section { margin-bottom: 34px; }

  .actors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .actor { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 10px; padding: 20px;
    background: #fff; border: 2px solid #d0d7de; border-radius: 14px; transition: border-color .15s, box-shadow .15s; }
  .actor:hover { border-color: #8bb8ec; }
  .actor.on { border-color: #0969da; box-shadow: 0 0 0 4px rgba(9, 105, 218, .15); }
  .actor .top { display: flex; align-items: center; gap: 12px; }
  .actor .av { width: 52px; height: 52px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 700; flex: none; }
  .actor .role { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #eef2f6; color: #3d4b5c; }
  .actor.on .role { background: #0969da; color: #fff; }
  .actor .name { font-size: 19px; font-weight: 700; margin-top: 4px; }
  .actor .title { font-size: 13px; color: #57606a; }
  .actor .sum { font-size: 14px; color: #3d4b5c; line-height: 1.6; }
  .actor .now { font-size: 13px; font-weight: 700; color: #0969da; visibility: hidden; }
  .actor.on .now { visibility: visible; }

  .apps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .apps a { display: block; padding: 18px; background: #fff; border: 1px solid #d0d7de; border-radius: 10px; color: inherit; text-decoration: none; }
  .apps a:hover { border-color: #0969da; }
  .apps b { display: block; font-size: 16px; margin-bottom: 4px; }
  .apps small { font-size: 13px; color: #57606a; }
  .reset { padding: 8px 14px; border: 1px solid #d0d7de; background: #fff; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px; }
  #msg { margin-left: 8px; color: #57606a; font-size: 14px; }
</style>
</head>
<body>
<script src="/shared/nav.js"></script>
<main>
  <h1>AI秘書デモ環境</h1>
  <p class="lead" id="site-name">（仮称）港南三丁目オフィスビル新築工事</p>

  <section>
    <h2>だれの目線で見るか（アカウント切替）</h2>
    <div class="actors" id="actors"></div>
  </section>

  <section>
    <h2>アプリ</h2>
    <ul class="apps">
      <li><a href="/chat"><b>チャット</b><small>現場のトークルーム</small></a></li>
      <li><a href="/mail"><b>メール</b><small>自分の受信箱</small></a></li>
      <li><a href="/calendar"><b>カレンダー</b><small>自分と関係者の予定</small></a></li>
      <li><a href="/storage"><b>ストレージ</b><small>現場の共有フォルダ</small></a></li>
      <li><a href="/schedule"><b>工程表</b><small>全体工程（ガント）</small></a></li>
    </ul>
  </section>

  <button class="reset" id="reset">デモデータを初期状態に戻す</button><span id="msg"></span>
</main>
<script type="module">
  import { watchState, currentActor, escapeHtml } from "/shared/api.js";
  const box = document.getElementById("actors");
  watchState(["site"], (state) => {
    const site = state.site;
    document.getElementById("site-name").textContent = site.site.name;
    const cur = currentActor(state).personaId;
    box.innerHTML = site.personas.map((p) => {
      const u = site.people.find((x) => x.id === p.personId);
      return `<button class="actor ${p.id === cur ? "on" : ""}" data-id="${p.id}" type="button">
        <div class="top"><div class="av" style="background:${u.color}">${escapeHtml(u.name[0])}</div>
          <div><span class="role">${escapeHtml(p.label)}</span><div class="name">${escapeHtml(u.name)}</div><div class="title">${escapeHtml(u.title)}</div></div></div>
        <div class="sum">${escapeHtml(p.summary)}</div>
        <div class="now">✓ この目線で表示中</div>
      </button>`;
    }).join("");
  });
  box.addEventListener("click", async (e) => {
    const b = e.target.closest(".actor");
    if (!b) return;
    await fetch("/api/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ personaId: b.dataset.id }) });
    box.querySelectorAll(".actor").forEach((x) => x.classList.toggle("on", x === b));
  });
  document.getElementById("reset").onclick = async () => {
    const r = await fetch("/admin/reset", { method: "POST" }).then((r) => r.json());
    document.getElementById("msg").textContent = r.ok ? "初期状態に戻しました" : "失敗しました";
  };
</script>
</body>
</html>
