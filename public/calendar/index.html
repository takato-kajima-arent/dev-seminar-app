<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カレンダー</title>
  <link rel="stylesheet" href="/calendar/calendar.css">
</head>
<body>
  <script src="/shared/nav.js"></script>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" title="メインメニュー" aria-label="メインメニュー">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <div class="brand">
        <div class="brand-logo"><span class="brand-logo-top"></span><span class="brand-logo-num" id="brandDay">11</span></div>
        <span class="brand-name">カレンダー</span>
      </div>
      <button class="today-btn" id="btnToday">今日</button>
      <button class="icon-btn" id="btnPrev" title="前へ" aria-label="前へ">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <button class="icon-btn" id="btnNext" title="次へ" aria-label="次へ">
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
      </button>
      <h1 class="range-title" id="rangeTitle"></h1>
      <div class="spacer"></div>
      <div class="view-switch" id="viewSwitch" role="tablist">
        <button data-view="day">日</button>
        <button data-view="week">週</button>
        <button data-view="people">メンバー並び</button>
      </div>
      <div class="me-avatar" id="meAvatar" title=""></div>
    </header>

    <aside class="sidebar">
      <button class="create-btn" type="button">
        <svg viewBox="0 0 24 24"><path fill="#1a73e8" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <span>作成</span>
      </button>
      <div class="mini" id="mini"></div>
      <div class="cal-list">
        <div class="cal-list-head">マイカレンダー</div>
        <div id="calList"></div>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>
  <div class="popover" id="popover" hidden></div>
  <div class="toast-wrap" id="toasts"></div>
  <script type="module" src="/calendar/calendar.js"></script>
</body>
</html>
